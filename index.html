    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.expand();
        if (tg.colorScheme === 'dark') document.body.classList.add('dark-theme');
    }

    const userName = tg?.initDataUnsafe?.user?.first_name || "همکار عزیز";
    if (document.getElementById('board-name')) document.getElementById('board-name').innerText = userName;

    const millerRoadmap = [

        { w: 1, id: 11, title: "شل‌کننده‌های عضلانی", type: "exciting", icon: "💪" },
        { w: 1, id: 17, title: "بی‌حسی نخاعی و اپیدورال", type: "exciting", icon: "🦴" },
        { w: 1, id: 4, title: "اصول پایه فارماکولوژی", type: "dry", icon: "📚" },

        { w: 1, id: 24, title: "مدیریت مایعات", type: "exciting", icon: "💧" },

        { w: 2, id: 43, title: "بیهوشی در تروما", type: "exciting", icon: "🚑" },
        { w: 2, id: 2, title: "یادگیری بیهوشی", type: "dry", icon: "🧠" },
        { w: 2, id: 7, title: "هوشبرهای استنشاقی", type: "exciting", icon: "💨" },
        { w: 2, id: 9, title: "داروهای اپیوئیدی", type: "exciting", icon: "💊" },
        { w: 2, id: 6, title: "سیستم عصبی خودمختار", type: "dry", icon: "🔬" },

        { w: 2, id: 10, title: "بی‌حس‌کننده‌های موضعی", type: "exciting", icon: "🎯" },
        { w: 2, id: 13, title: "ارزیابی پیش از عمل", type: "dry", icon: "📋" },
        { w: 2, id: 18, title: "بلوک‌های اعصاب محیطی", type: "exciting", icon: "⚡" },
        { w: 2, id: 21, title: "سونوگرافی POCUS", type: "exciting", icon: "🖥️" },

        { w: 3, id: 15, title: "سیستم‌های تحویل بیهوشی", type: "dry", icon: "⚙️" },
        { w: 3, id: 25, title: "خون‌‌درمانی", type: "exciting", icon: "🩸" },
        { w: 3, id: 33, title: "بیهوشی در مامایی", type: "exciting", icon: "🤰" },
        { w: 3, id: 19, title: "پوزیشن دادن به بیمار", type: "dry", icon: "🛏️" },
        { w: 3, id: 34, title: "بیهوشی اطفال", type: "exciting", icon: "👶" },
        { w: 3, id: 26, title: "بیماری‌های قلبی عروقی", type: "exciting", icon: "🫀" },
        { w: 3, id: 23, title: "هموستاز و انعقاد", type: "dry", icon: "🩸" },
        { w: 3, id: 30, title: "بیماری‌های سیستم عصبی", type: "exciting", icon: "🧠" },
        { w: 3, id: 39, title: "ریکاوری پس از بیهوشی", type: "exciting", icon: "🛌" },
        { w: 3, id: 12, title: "سمیت عصبی داروهای بیهوشی", type: "dry", icon: "⚠️" },

        { w: 4, id: 41, title: "پزشکی مراقبت‌های ویژه", type: "exciting", icon: "🏥" },
        { w: 4, id: 40, title: "مدیریت درد حین عمل", type: "exciting", icon: "💉" },
        { w: 4, id: 27, title: "بیماری‌های مزمن ریوی", type: "dry", icon: "🫁" },
        { w: 4, id: 36, title: "پیوند اعضا", type: "exciting", icon: "🤝" },
        { w: 4, id: 14, title: "انتخاب تکنیک بیهوشی", type: "exciting", icon: "🤔" },
        { w: 4, id: 28, title: "بیماری‌های کلیوی و کبدی", type: "dry", icon: "🔬" },
        { w: 4, id: 37, title: "بیهوشی سرپایی", type: "exciting", icon: "🚶" },
        { w: 4, id: 38, title: "مکان‌های غیر اتاق عمل", type: "exciting", icon: "🏢" },
        { w: 4, id: 29, title: "بیماری‌های غدد و گوارش", type: "dry", icon: "🍏" },
        { w: 4, id: 31, title: "چشم‌پزشکی و گوش و حلق", type: "exciting", icon: "👁" },

        { w: 5, id: 32, title: "جراحی ارتوپدی", type: "exciting", icon: "🦴" },
        { w: 5, id: 3, title: "سلامت روان کادر درمان", type: "dry", icon: "🧘" },
        { w: 5, id: 44, title: "مدیریت درد مزمن", type: "exciting", icon: "🤕" },
        { w: 5, id: 42, title: "پزشکی حین عمل", type: "exciting", icon: "🩺" },
        { w: 5, id: 35, title: "بیهوشی در سالمندان", type: "dry", icon: "🧓" },
        { w: 5, id: 47, title: "مراقبت‌های تسکینی", type: "exciting", icon: "🕊️" },
        { w: 5, id: 48, title: "پزشکی خواب", type: "exciting", icon: "💤" },
        { w: 5, id: 46, title: "کیفیت و ایمنی بیمار", type: "dry", icon: "🛡️" },
        { w: 5, id: 49, title: "سلامت محیط زیست", type: "dry", icon: "🌍" }
    ];

    const worldNames = {
        1: "💥 منطقه ۱: ورود به اتاق عمل (The Hook)",
        2: "🧪 منطقه ۲: فارماکولوژی و بحران",
        3: "⚙️ منطقه ۳: خون، ماشین و ریکاوری",
        4: "👹 منطقه ۴: تخصص‌ها و غول‌های آخر",
        5: "🏆 منطقه ۵: مدیریت و ایمنی بالینی"
    };

    let currentQuestions = [];
    let currentMode = 'study';
    let currentQIndex = 0;
    let userScore = 0;
    let userRole = 'ثبت نشده';
    let activeNodeElement = null;
    let currentChapterData = null;
    let userAnswers = [];
    let isDailyReviewMode = false;

    // خواندن پارامترهای آدرس
    const urlParams = new URLSearchParams(window.location.search);
    const rawReviewItems = urlParams.get('review_items');
    // ساخت آرایه‌ای از { chapterId, questionId }
    const dueReviewItems = rawReviewItems 
        ? rawReviewItems.split(',').filter(x => x.includes('-')).map(item => {
            const [ch, q] = item.split('-');
            return { chapterId: Number(ch), questionId: Number(q) };
        })
        : [];

    const lastCompletedChapter = Number(urlParams.get('last_ch') || 0);

    function getChapterFileName(chId) {
        return chId === 16 ? 'airway_managment.json' : `chapter_${chId}.json`;
    }

    function renderRoadmap() {
        const container = document.getElementById('roadmap-container');
        container.innerHTML = '';
        let currentWorld = 0;
        let pathContainer = null;
        let unlockNext = true;

        millerRoadmap.forEach((ch) => {
            if (ch.w !== currentWorld) {
                currentWorld = ch.w;
                const section = document.createElement('div');
                section.className = 'level-section';
                section.innerHTML = `<div class="level-header" style="color: var(--w${currentWorld}-color)">${worldNames[currentWorld]}</div>`;
                
                pathContainer = document.createElement('div');
                pathContainer.className = 'path-container';
                section.appendChild(pathContainer);
                container.appendChild(section);
            }

            const node = document.createElement('div');
            // اگر قبلاً فصل پاس شده یا نوبت باز شدنش است، قفل باز باشد
            const isUnlocked = (ch.id <= lastCompletedChapter) || unlockNext;
            node.className = `level-node ${isUnlocked ? '' : 'locked'}`;
            if (isUnlocked && ch.id > lastCompletedChapter) unlockNext = false;

            if (ch.type === "dry") {
                node.classList.add('dry-node');
                node.style.color = "white";
            } else {
                node.style.backgroundColor = `var(--w${currentWorld}-color)`;
                node.style.color = "white";
            }

            node.innerHTML = `
                ${ch.icon}
                <div class="level-label">فصل ${ch.id}: ${ch.title}</div>
            `;
            
            node.onclick = function() {
                if(!this.classList.contains('locked')) startQuiz(ch, this);
            };

            pathContainer.appendChild(node);
        });
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function checkDailyReviewBanner() {
        const banner = document.getElementById('review-banner');
        if (banner && dueReviewItems.length > 0) {
            banner.style.display = 'block';
            const countText = document.getElementById('review-count-text');
            if (countText) countText.innerText = `امروز ${dueReviewItems.length} نکته در نوبت مرور حافظه بلندمدت داری.`;
        }
    }

    function finishOnboarding(role) {
        userRole = role;
        renderRoadmap();
        showScreen('dashboard-screen');
        document.getElementById('bottom-nav').style.display = 'flex';
        checkDailyReviewBanner();
    }

    function switchTab(tabId, btn) {
        showScreen(tabId);
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        btn.classList.add('active');
    }

    async function startQuiz(chapterData, element) {
        activeNodeElement = element;
        currentChapterData = chapterData;
        isDailyReviewMode = false;
        document.getElementById('bottom-nav').style.display = 'none';
        currentMode = 'study';
        currentQIndex = 0;
        userScore = 0;
        userAnswers = [];
        
        document.getElementById('question-text').innerText = "در حال بارگذاری سوالات... ⏳";
        document.getElementById('options-container').innerHTML = '';
        showScreen('quiz-screen');

        try {
            const fileName = getChapterFileName(chapterData.id);
            const cacheBuster = new Date().getTime();
            const response = await fetch(`${fileName}?t=${cacheBuster}`, {
                headers: { 'Cache-Control': 'no-cache' }
            });
            
            if (!response.ok) throw new Error(`خطای دریافت فایل ${fileName}`);
            
            let all = await response.json();
            // تضمین داشتن id یکتا برای هر سوال
            all = all.map((q, idx) => ({ ...q, id: q.id !== undefined ? q.id : (idx + 1), chapter_id: chapterData.id }));
            
            currentQuestions = all.sort(() => 0.5 - Math.random()).slice(0, 5);
            loadQuestion();
        } catch (error) {
            console.error("Quiz Load Error:", error);
            document.getElementById('question-text').innerText = `⚠️ خطا در بارگذاری فصل ${chapterData.id}`;
            document.getElementById('options-container').innerHTML = `
                <button class="btn primary-action" onclick="returnToRoadmap()">بازگشت به مسیر</button>
            `;
        }
    }

    async function startDailyReview() {
        document.getElementById('bottom-nav').style.display = 'none';
        isDailyReviewMode = true;
        currentMode = 'study';
        currentQIndex = 0;
        userScore = 0;
        userAnswers = [];
        currentChapterData = { id: 0, title: "مرور روزانه لایتنر" };

        document.getElementById('question-text').innerText = "در حال تجمیع نکات موعد امروز... ⏳";
        document.getElementById('options-container').innerHTML = '';
        showScreen('quiz-screen');

        try {
            // استخراج فصولی که در لیست امروز وجود دارند
            const uniqueChapters = [...new Set(dueReviewItems.map(item => item.chapterId))];
            let aggregatedQuestions = [];

            for (let chId of uniqueChapters) {
                try {
                    const fileName = getChapterFileName(chId);
                    const res = await fetch(`${fileName}?t=${Date.now()}`);
                    if (res.ok) {
                        let list = await res.json();
                        list = list.map((q, idx) => ({ ...q, id: q.id !== undefined ? q.id : (idx + 1), chapter_id: chId }));
                        
                        const targetIds = dueReviewItems.filter(i => i.chapterId === chId).map(i => i.questionId);
                        const matched = list.filter(q => targetIds.includes(q.id));
                        aggregatedQuestions.push(...matched);
                    }
                } catch(e) {
                    console.warn(`فصل ${chId} لود نشد:`, e);
                }
            }

            if (aggregatedQuestions.length === 0) {
                // اگر پیدا نشد، به عنوان فال‌بک ۵ سوال از راه هوایی می‌آورد
                const res = await fetch(`airway_managment.json?t=${Date.now()}`);
                let list = await res.json();
                aggregatedQuestions = list.slice(0, 5).map((q, idx) => ({ ...q, id: q.id !== undefined ? q.id : (idx + 1), chapter_id: 16 }));
            }

            currentQuestions = aggregatedQuestions;
            loadQuestion();
        } catch (err) {
            console.error("Error in startDailyReview:", err);
            returnToRoadmap();
        }
    }

    function loadQuestion() {
        if (currentMode === 'study') {
            loadStudyTip();
        } else {
            loadQuizQuestion();
        }
    }

    function loadStudyTip() {
        const total = currentQuestions.length;
        const progressPercent = ((currentQIndex + 1) / total) * 100;
        document.getElementById('progress').style.width = progressPercent + '%';

        const q = currentQuestions[currentQIndex];
        
        document.getElementById('question-text').innerHTML = `
            <div style="font-size: 15px; color: var(--primary-btn); margin-bottom: 12px; font-weight: bold;">
                💡 نکته آموزشی (${currentQIndex + 1} از ${total}):
            </div>
            <div style="font-size: 18px; line-height: 1.8; text-align: justify;">
                ${q.tip_text}
            </div>
        `;
        
        const isLastTip = (currentQIndex === total - 1);
        const optsContainer = document.getElementById('options-container');
        optsContainer.innerHTML = '';

        const actionBtn = document.createElement('button');
        actionBtn.className = 'btn primary-action';
        actionBtn.style.marginTop = '25px';

        if (isLastTip) {
            actionBtn.innerText = `شروع آزمون این ${total} نکته 🎯`;
            actionBtn.onclick = startQuizPhase;
        } else {
            actionBtn.innerText = 'نکته بعدی ⬅️';
            actionBtn.onclick = nextTip;
        }

        optsContainer.appendChild(actionBtn);
    }

    function nextTip() {
        currentQIndex++;
        loadStudyTip();
    }

    function startQuizPhase() {
        currentMode = 'quiz';
        currentQIndex = 0;
        document.getElementById('progress').style.width = '0%';
        loadQuizQuestion();
    }

    function loadQuizQuestion() {
        if (currentQIndex >= currentQuestions.length) {
            return finishQuiz();
        }

        const progressPercent = ((currentQIndex) / currentQuestions.length) * 100;
        document.getElementById('progress').style.width = progressPercent + '%';

        const q = currentQuestions[currentQIndex];
        
        document.getElementById('question-text').innerHTML = `
            <div style="font-size: 14px; opacity: 0.7; margin-bottom: 8px;">تست ${currentQIndex + 1} از ${currentQuestions.length}</div>
            <div>❓ ${q.question}</div>
        `;
        
        const optsContainer = document.getElementById('options-container');
        optsContainer.innerHTML = '';

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(idx, btn);
            optsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex, btnNode) {
        const q = currentQuestions[currentQIndex];
        const allBtns = document.getElementById('options-container').children;
        for (let b of allBtns) b.disabled = true;

        const correctIdx = q.correct_option_index !== undefined ? q.correct_option_index : q.correct_index;
        const isCorrect = (selectedIndex === correctIdx);

        userAnswers.push({
            chapter_id: q.chapter_id,
            question_id: q.id,
            is_correct: isCorrect
        });

        let delayTime = 1200;

        if (selectedIndex === correctIdx) {
            btnNode.classList.add('correct');
            userScore += 10;
            document.getElementById('board-score').innerText = userScore + " XP";
            try { tg?.HapticFeedback?.notificationOccurred('success'); } catch(e){}
        } else {
            btnNode.classList.add('wrong');
            if (allBtns[correctIdx]) allBtns[correctIdx].classList.add('correct');
            
            const expDiv = document.createElement('div');
            expDiv.style.marginTop = "20px";
            expDiv.style.color = "#e53935";
            expDiv.style.fontSize = "16px";
            expDiv.style.fontWeight = "bold";
            expDiv.style.lineHeight = "1.6";
            expDiv.innerText = "❌ " + q.explanation;
            document.getElementById('options-container').appendChild(expDiv);

            delayTime = 4000;
            try { tg?.HapticFeedback?.notificationOccurred('error'); } catch(e){}
        }

        setTimeout(() => {
            currentQIndex++;
            loadQuizQuestion();
        }, delayTime);
    }

    function finishQuiz() {
        document.getElementById('progress').style.width = '100%';
        const title = isDailyReviewMode ? "مرور روزانه لایتنر" : `فصل ${currentChapterData.id} (${currentChapterData.title})`;
        document.getElementById('question-text').innerText = `${title} به پایان رسید! 🎉\nکارت عالی بود.`;
        
        document.getElementById('options-container').innerHTML = `
            <button class="btn primary-action" onclick="submitAndReturn()">
                ثبت نتیجه و بازگشت 🗺️
            </button>
        `;
    }

    function submitAndReturn() {
        if (tg) {
            const payload = {
                action: isDailyReviewMode ? 'review_daily' : 'finish_chapter',
                chapter_id: currentChapterData.id,
                chapter_title: currentChapterData.title,
                score: userScore,
                role: userRole,
                answers: userAnswers
            };
            tg.sendData(JSON.stringify(payload));
        }
        returnToRoadmap();
    }

    function returnToRoadmap() {
        if (activeNodeElement && !isDailyReviewMode) {
            let nextNode = activeNodeElement.nextElementSibling;
            if(!nextNode) {
                const nextSection = activeNodeElement.closest('.level-section')?.nextElementSibling;
                if(nextSection) nextNode = nextSection.querySelector('.level-node');
            }
            if(nextNode && nextNode.classList.contains('locked')) {
                nextNode.classList.remove('locked');
            }
        }
        
        showScreen('dashboard-screen');
        document.getElementById('bottom-nav').style.display = 'flex';
        document.getElementById('progress').style.width = '0%';
    }
</script>
